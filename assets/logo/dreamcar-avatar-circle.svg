<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="DreamCar Avatar Circle">
  <title>DreamCar — кругла аватарка з UA tag і DC monogram</title>
  <defs>
    <style>
      .bg-circle { fill: #0A0A0A; }
      .frame { fill: none; stroke: #FFFFFF; stroke-width: 8; }
      .ua-tag-bg { fill: #E30613; }
      .heavy { font-family: "Archivo Black", "Arial Black", "Helvetica Neue Black", "Liberation Sans Bold", "DejaVu Sans Bold", sans-serif; font-weight: 900; }
      .ua-text { font-size: 36px; fill: #FFFFFF; }
      .dc-text { font-size: 144px; }
      .dc-d { fill: #FFFFFF; }
      .dc-c { fill: #E30613; }
      .brand-tag { font-size: 22px; fill: #FFFFFF; letter-spacing: 0.18em; }
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E30613" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#E30613" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E30613" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="200" r="200" fill="url(#glow)"/>
  <circle class="bg-circle" cx="200" cy="200" r="190"/>
  <circle class="frame" cx="200" cy="200" r="184"/>

  <!-- UA tag -->
  <rect class="ua-tag-bg" x="158" y="58" width="84" height="48" rx="3"/>
  <text x="200" y="96" text-anchor="middle"
        class="heavy ua-text"
        textLength="46" lengthAdjust="spacingAndGlyphs">UA</text>

  <!-- DC monogram -->
  <text x="120" y="248"
        class="heavy dc-text dc-d"
        textLength="84" lengthAdjust="spacingAndGlyphs">D</text>
  <text x="208" y="248"
        class="heavy dc-text dc-c"
        textLength="84" lengthAdjust="spacingAndGlyphs">C</text>

  <!-- DREAMCAR -->
  <text x="200" y="324" text-anchor="middle"
        class="heavy brand-tag"
        textLength="160" lengthAdjust="spacingAndGlyphs">DREAMCAR</text>
</svg>
