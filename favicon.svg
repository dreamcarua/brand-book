<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Чорне коло з білою рамкою -->
  <circle cx="50" cy="50" r="46" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Зовнішня червона рамка -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#E30613" stroke-width="2"/>
  <!-- D — біла -->
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
        font-family="'Archivo Black', 'Arial Black', Impact, sans-serif"
        font-size="42" font-weight="900">
    <tspan fill="#FFFFFF" dx="-10">D</tspan><tspan fill="#E30613" dx="0">C</tspan>
  </text>
</svg>

