<!DOCTYPE html>
<html lang="uk" style="background:#0A0A0A;color-scheme:dark;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex, follow">
<title>404 — Сторінку не знайдено · DreamCar Brand Book</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Archivo+Black&family=Manrope:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse at 70% 50%, rgba(227,6,19,0.3) 0%, transparent 60%),
      #0A0A0A;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#1F1F1F 1px, transparent 1px),
      linear-gradient(90deg, #1F1F1F 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.15;
    pointer-events: none;
  }
  .container {
    text-align: center;
    max-width: 640px;
    position: relative;
    z-index: 2;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #FF1A2B;
    margin-bottom: 24px;
  }
  .number {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(120px, 25vw, 240px);
    line-height: 0.85;
    letter-spacing: -0.02em;
    color: #E30613;
    text-shadow: 4px 4px 0 #B8050F, 8px 8px 0 #0A0A0A;
    margin-bottom: 24px;
  }
  .title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 56px);
    line-height: 1;
    letter-spacing: 0.01em;
    margin-bottom: 16px;
  }
  .title .red { color: #E30613; }
  .desc {
    color: #DDDDDD;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
  .cta {
    display: inline-block;
    background: #E30613;
    color: #FFFFFF;
    padding: 16px 28px;
    font-family: 'Manrope', sans-serif; font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-decoration: none;
    border-radius: 0;
    transition: transform 150ms cubic-bezier(0.2, 0.9, 0.3, 1), background 150ms;
  }
  .cta:hover { transform: translateY(-2px); background: #B8050F; }
  .cta::after { content: ' →'; }
  .cta.ghost {
    background: transparent;
    color: #FFFFFF;
    border: 1px solid #2A2A2A;
  }
  .cta.ghost:hover { border-color: #E30613; background: rgba(227,6,19,0.08); }

  .shortcuts {
    margin-top: 20px;
    padding: 18px;
    background: rgba(20,20,20,0.6);
    border: 1px solid #2A2A2A;
    border-radius: 4px;
  }
  .shortcuts .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: #888;
    margin-bottom: 12px;
  }
  .shortcuts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .shortcut {
    padding: 10px 12px;
    background: #141414;
    border: 1px solid #2A2A2A;
    color: #DDDDDD;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-decoration: none;
    border-radius: 3px;
    transition: border-color 150ms, color 150ms;
  }
  .shortcut:hover { border-color: #E30613; color: #FFFFFF; }

  .meta {
    margin-top: 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #888;
    letter-spacing: 0.2em;
  }

  @media (prefers-color-scheme: light) {
    html, body { background: #0A0A0A !important; color: #FFFFFF !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
    .cta:hover { transform: none; }
  }
  .search404 { margin: 40px 0 8px; max-width: 560px; }
  .search404-row { display: flex; gap: 8px; margin-top: 10px; }
  .search404 input { flex: 1; min-width: 0; background: #0A0A0A; border: 1px solid #2A2A2A; color: #fff; padding: 14px 16px;
    font-family: 'Manrope', sans-serif; font-size: 15px; }
  .search404 input:focus-visible { outline: 2px solid #E30613; outline-offset: 0; }
</style>
</head>
<body>
  <main class="container" id="main">
    <div class="tag">/// PAGE NOT FOUND</div>
    <div class="number">404</div>
    <h1 class="title">МАШИНУ <span class="red">ВЖЕ ЗАБРАЛИ.</span></h1>
    <p class="desc">Сторінки, яку ти шукаєш, не існує — або вона переїхала. Знайди потрібне пошуком або почни з головної.</p>
    <div class="cta-row">
      <a href="/" class="cta">НА ГОЛОВНУ</a>
      <a href="/sections/quickstart.html" class="cta ghost">QUICK START</a>
    </div>
    <form class="search404" action="/sections/quickstart.html" method="get" role="search">
      <label for="q404" class="lbl">/// ЗНАЙТИ В БРЕНДБУЦІ</label>
      <div class="search404-row">
        <input id="q404" name="search" type="search" placeholder="логотип, червоний, заборонені слова…" autocomplete="off">
        <button type="submit" class="cta">ШУКАТИ</button>
      </div>
    </form>
    <div class="shortcuts">
      <div class="lbl">/// ШВИДКИЙ ДОСТУП</div>
      <div class="shortcuts-grid">
        <a href="/sections/legal.html" class="shortcut">LEGAL-SAFE ЛЕКСИКОН</a>
        <a href="/sections/logo.html" class="shortcut">ЛОГОТИП І ФАЙЛИ</a>
        <a href="/sections/tools.html" class="shortcut">ІНСТРУМЕНТИ</a>
        <a href="/sections/generator.html" class="shortcut">ГЕНЕРАТОР ПОСТІВ</a>
      </div>
    </div>
    <div class="meta">DREAMCAR · BRAND BOOK</div>
  </main>
</body>
</html>
