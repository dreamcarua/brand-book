<!DOCTYPE html>
<html lang="uk" style="background:#0A0A0A;color-scheme:dark;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0A0A">
<title>404 — Сторінку не знайдено · DreamCar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo+Black&family=Manrope:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse at 70% 50%, rgba(227,6,19,0.3) 0%, transparent 60%),
      #0A0A0A;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#1F1F1F 1px, transparent 1px),
      linear-gradient(90deg, #1F1F1F 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.15;
    pointer-events: none;
  }
  .container {
    text-align: center;
    max-width: 600px;
    position: relative;
    z-index: 2;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #E30613;
    margin-bottom: 24px;
  }
  .number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(120px, 25vw, 240px);
    line-height: 0.85;
    letter-spacing: -0.02em;
    color: #E30613;
    text-shadow: 4px 4px 0 #B8050F, 8px 8px 0 #0A0A0A;
    margin-bottom: 24px;
  }
  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 6vw, 56px);
    line-height: 1;
    letter-spacing: 0.01em;
    margin-bottom: 16px;
  }
  .title .red { color: #E30613; }
  .desc {
    color: #DDDDDD;
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 40px;
  }
  .cta {
    display: inline-block;
    background: #E30613;
    color: #FFFFFF;
    padding: 16px 32px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 14px;
    letter-spacing: 0.1em;
    text-decoration: none;
    border-radius: 999px;
    transition: transform 150ms cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .cta:hover { transform: translateY(-2px); background: #B8050F; }
  .cta::after { content: ' →'; }

  .meta {
    margin-top: 60px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #888;
    letter-spacing: 0.2em;
  }

  @media (prefers-color-scheme: light) {
    html, body { background: #0A0A0A !important; color: #FFFFFF !important; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="tag">/// PAGE NOT FOUND</div>
    <div class="number">404</div>
    <h1 class="title">МАШИНУ <span class="red">ВЖЕ ЗАБРАЛИ.</span></h1>
    <p class="desc">Сторінка, яку ти шукаєш, не існує — або переїхала. Повертайся на головну, там точно є те, що тобі потрібно.</p>
    <a href="/" class="cta">НА ГОЛОВНУ</a>
    <div class="meta">DREAMCAR · BRAND BOOK · V2.1</div>
  </div>
</body>
</html>
