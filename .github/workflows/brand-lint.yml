name: Brand Lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Лінт бренд-канону (NEVER-лексика, плейсхолдери, биті лінки, структура)
        run: python3 scripts/brand_lint.py
