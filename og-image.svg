<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="redGlow" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E30613" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#1F1F1F" stroke-width="1" opacity="0.5"/>
    </pattern>
    <style>
      .heavy { font-family: "Archivo Black","Arial Black","Helvetica Neue Black","Liberation Sans Bold","DejaVu Sans Bold",sans-serif; font-weight: 900; }
      .display { font-family: "Oswald","Bebas Neue","Arial Narrow Bold","Liberation Sans Bold",sans-serif; font-weight: 700; }
      .mono { font-family: "JetBrains Mono","DejaVu Sans Mono",monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#redGlow)"/>

  <!-- Mono tag зверху -->
  <text x="60" y="80" class="mono" font-size="16" letter-spacing="3" fill="#E30613">/// БРЕНДБУК · ОПЕРАЦІЙНА СИСТЕМА БРЕНДУ</text>

  <!-- Logo Racing Plate -->
  <g transform="translate(60, 130)">
    <rect x="6" y="6" width="540" height="100" fill="#B8050F"/>
    <rect x="0" y="0" width="540" height="100" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="0" y="0" width="100" height="100" fill="#E30613"/>
    <line x1="100" y1="0" x2="100" y2="100" stroke="#FFFFFF" stroke-width="4"/>
    <text x="50" y="68" text-anchor="middle"
          class="heavy" font-size="44" fill="#FFFFFF"
          textLength="56" lengthAdjust="spacingAndGlyphs">UA</text>
    <text x="120" y="70"
          class="heavy" font-size="56" fill="#FFFFFF"
          textLength="240" lengthAdjust="spacingAndGlyphs">DREAM</text>
    <text x="370" y="70"
          class="heavy" font-size="56" fill="#E30613"
          textLength="150" lengthAdjust="spacingAndGlyphs">CAR</text>
  </g>

  <!-- Заголовок -->
  <text x="60" y="350" class="display" font-size="100" fill="#FFFFFF" letter-spacing="-2">МРІЯ.</text>
  <text x="60" y="450" class="display" font-size="100" fill="#FFFFFF" letter-spacing="-2">ЗА ЦІНОЮ</text>
  <text x="60" y="550" class="display" font-size="100" fill="#E30613" letter-spacing="-2">ЧАШКИ КАВИ.</text>

  <!-- Низ — meta -->
  <text x="60" y="595" class="mono" font-size="14" letter-spacing="3" fill="#888">DREAMCAR · UA · EST. 2016 · 19 КЛЮЧІВ ВРУЧЕНО · 500K+ СПІЛЬНОТА</text>

  <!-- Червона лінія справа знизу -->
  <rect x="1100" y="555" width="60" height="4" fill="#E30613"/>
</svg>
